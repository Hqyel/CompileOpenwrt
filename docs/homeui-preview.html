<!DOCTYPE html>
<html lang="zh-CN" data-color-mode="light" data-darkmode="false">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HomeUI 视觉预览</title>
    <link rel="stylesheet"
      href="../package/luci-theme-homeui/htdocs/luci-static/homeui/cascade.css">
    <link rel="stylesheet" media="only screen and (max-width: 900px)"
      href="../package/luci-theme-homeui/htdocs/luci-static/homeui/mobile.css">
    <style>
      * {
        box-sizing: border-box;
      }

      .preview-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        gap: 14px;
        margin-bottom: 16px;
      }

      .preview-stat {
        min-height: 112px;
        padding: 16px;
        border: 1px solid var(--homeui-border);
        border-radius: var(--homeui-radius);
        background: var(--homeui-surface);
        box-shadow: var(--homeui-shadow);
      }

      .preview-stat small {
        color: var(--homeui-muted);
      }

      .preview-stat strong {
        display: block;
        margin: 10px 0 5px;
        color: var(--text-color-highest);
        font-size: 25px;
        font-weight: 650;
      }

      .preview-stat span {
        color: var(--homeui-success);
        font-size: 12px;
      }

      .preview-chart {
        height: 210px;
        display: flex;
        align-items: flex-end;
        gap: 4%;
        padding: 22px 18px 30px;
        border: 1px solid var(--homeui-border);
        border-radius: var(--homeui-radius);
        background:
          repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 39px,
            var(--homeui-border) 40px
          ),
          var(--homeui-surface);
        box-shadow: var(--homeui-shadow);
      }

      .preview-chart span {
        flex: 1;
        min-width: 12px;
        border-radius: 4px 4px 0 0;
        background: linear-gradient(
          to top,
          rgba(47, 137, 255, .18),
          var(--homeui-accent)
        );
      }

      .preview-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 16px;
      }

      .preview-title h2 {
        margin: 0;
      }

      .homeui-menu-icon svg {
        display: block;
      }

      .table .tr {
        display: grid;
        grid-template-columns: 1fr 1.4fr 1fr 1fr 1fr;
      }

      .table .th,
      .table .td {
        display: block;
      }

      @media (max-width: 760px) {
        .preview-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-page="admin-status-overview">
    <header class="homeui-shell">
      <div class="homeui-brand">
        <a class="homeui-brand-link" href="#">
          <img
          src="../package/luci-theme-homeui/htdocs/luci-static/homeui/logo.svg"
          alt="">
          <span><strong>HomeUI</strong><small>HomeWrt</small></span>
        </a>
        <button id="homeui-collapse" type="button" aria-label="折叠菜单">
          <span></span><span></span><span></span>
        </button>
      </div>
      <nav class="homeui-rail">
        <ul id="topmenu">
          <li class="active">
            <a href="#">
              <span class="homeui-menu-icon">
                <svg viewBox="0 0 24 24">
                  <path d="M4 18V8m6 10V4m6 14v-7m6 7V2"/>
                </svg>
              </span>
              <span>状态</span>
            </a>
          </li>
          <li>
            <a href="#">
              <span class="homeui-menu-icon">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M12 2v3m0 14v3M2 12h3m14 0h3"/>
                </svg>
              </span>
              <span>系统</span>
            </a>
          </li>
          <li>
            <a href="#">
              <span class="homeui-menu-icon">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="5" rx="2"/>
                  <rect x="3" y="15" width="18" height="5" rx="2"/>
                </svg>
              </span>
              <span>服务</span>
            </a>
          </li>
          <li>
            <a href="#">
              <span class="homeui-menu-icon">
                <svg viewBox="0 0 24 24">
                  <circle cx="12" cy="5" r="2"/>
                  <circle cx="5" cy="19" r="2"/>
                  <circle cx="19" cy="19" r="2"/>
                  <path d="M12 7v4M5 17v-3h14v3"/>
                </svg>
              </span>
              <span>网络</span>
            </a>
          </li>
        </ul>
      </nav>
      <nav class="homeui-panel">
        <div class="homeui-panel-heading">
          <span class="homeui-menu-icon">
            <svg viewBox="0 0 24 24">
              <path d="M4 18V8m6 10V4m6 14v-7m6 7V2"/>
            </svg>
          </span>
          <strong>状态</strong>
        </div>
        <ul id="sidemenu">
          <li class="active">
            <a href="#"><span class="homeui-side-dot"></span>概览</a>
          </li>
          <li><a href="#"><span class="homeui-side-dot"></span>防火墙</a></li>
          <li><a href="#"><span class="homeui-side-dot"></span>路由</a></li>
          <li><a href="#"><span class="homeui-side-dot"></span>系统日志</a></li>
          <li><a href="#"><span class="homeui-side-dot"></span>进程</a></li>
        </ul>
        <div class="homeui-panel-footer">
          <button id="homeui-color-toggle" type="button">
            <span class="homeui-color-icon"></span>
            <span class="homeui-color-label">Light</span>
          </button>
        </div>
      </nav>
    </header>

    <div id="maincontent" class="container">
      <div class="preview-title">
        <div>
          <h2>系统概览</h2>
          <div class="cbi-map-descr">运行稳定，一切服务均正常</div>
        </div>
        <button class="btn cbi-button-positive">刷新数据</button>
      </div>

      <div class="preview-grid">
        <section class="preview-stat">
          <small>系统运行时间</small>
          <strong>3 天 21 小时</strong>
          <span>运行正常</span>
        </section>
        <section class="preview-stat">
          <small>实时连接</small>
          <strong>378</strong>
          <span>TCP 243 · UDP 122</span>
        </section>
        <section class="preview-stat">
          <small>内存使用</small>
          <strong>34.8%</strong>
          <span>可用 1.3 GiB</span>
        </section>
      </div>

      <section class="cbi-section">
        <h3>实时流量</h3>
        <div class="preview-chart">
          <span style="height:24%"></span><span style="height:38%"></span>
          <span style="height:32%"></span><span style="height:48%"></span>
          <span style="height:43%"></span><span style="height:64%"></span>
          <span style="height:59%"></span><span style="height:72%"></span>
          <span style="height:56%"></span><span style="height:81%"></span>
          <span style="height:68%"></span><span style="height:88%"></span>
        </div>
      </section>

      <section class="cbi-section">
        <h3>网络接口</h3>
        <div class="table">
          <div class="tr table-titles">
            <div class="th">接口</div><div class="th">地址</div>
            <div class="th">状态</div><div class="th">下载</div>
            <div class="th">上传</div>
          </div>
          <div class="tr">
            <div class="td">LAN</div><div class="td">192.0.2.1</div>
            <div class="td"><span class="label success">在线</span></div>
            <div class="td">144.57 KB/s</div><div class="td">50.49 KB/s</div>
          </div>
          <div class="tr">
            <div class="td">WireGuard</div><div class="td">198.51.100.1</div>
            <div class="td"><span class="label success">在线</span></div>
            <div class="td">2.41 MB/s</div><div class="td">186.33 KB/s</div>
          </div>
        </div>
      </section>
    </div>
    <script
      src="../package/luci-theme-homeui/htdocs/luci-static/homeui/main.js">
    </script>
  </body>
</html>
